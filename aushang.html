<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masons Drinks – Aushang</title>
<meta name="robots" content="noindex">
<style>
  @page { size: A5; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #e5e5ea; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif; color: #fff; display: grid; place-items: center; min-height: 100vh; padding: 16px; }
  .sheet { width: min(148mm, 100%); aspect-ratio: 148 / 210; background: #000; border-radius: 6mm; padding: 14mm 12mm; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; }
  .eyebrow { color: #ff9f0a; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 11pt; }
  h1 { font-size: 34pt; margin: 2mm 0 0; letter-spacing: -.01em; }
  p { color: rgba(235,235,245,.7); font-size: 12pt; margin: 3mm 0 0; line-height: 1.4; }
  .qr { background: #fff; border-radius: 5mm; padding: 5mm; width: 78mm; max-width: 80%; }
  .qr img { display: block; width: 100%; }
  .foot { font-size: 9pt; color: rgba(235,235,245,.45); }
  .print { position: fixed; bottom: 16px; right: 16px; background: #ff9f0a; color: #000; border: 0; border-radius: 20px; padding: 10px 18px; font: 600 15px -apple-system, sans-serif; cursor: pointer; }
  @media print { html, body { background: #000; padding: 0; } .sheet { border-radius: 0; width: 148mm; height: 210mm; } .print { display: none; } * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style>
</head>
<body>
  <div class="sheet">
    <div>
      <div class="eyebrow">Masons · Team</div>
      <h1>Drinks</h1>
      <p>Alle Rezepte, Zutaten und Zubereitung.<br>Einfach mit der Handykamera scannen.</p>
    </div>
    <div class="qr"><img src="qr-code.svg" alt="QR-Code zur Masons Drinks App"></div>
    <div class="foot">Tipp: „Zum Home-Bildschirm“ hinzufügen – dann funktioniert die App auch ohne Internet.</div>
  </div>
  <button class="print" onclick="print()">Drucken</button>
</body>
</html>
